name: KOSHI Automated QA Test Suite

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend API & Security Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source_code/backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run Pytest Suite with Coverage
        run: |
          pytest --cov=app --cov-report=xml:coverage.xml --cov-report=term-missing tests/

      - name: Upload Backend Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: source_code/backend/coverage.xml
          retention-days: 14

  frontend-unit-test:
    name: Frontend Unit & Component Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source_code/frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: source_code/frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Suite with Coverage
        run: npm run test:coverage

      - name: Upload Frontend Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: source_code/frontend/coverage/
          retention-days: 14

  playwright-e2e-test:
    name: Playwright E2E Functional Workflows
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-unit-test]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: source_code/frontend/package-lock.json

      - name: Set up Python for E2E Backend WebServer
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r source_code/backend/requirements.txt
          pip install uvicorn

      - name: Install Frontend Dependencies
        working-directory: source_code/frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: source_code/frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Playwright E2E Functional Tests
        working-directory: source_code/frontend
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright Report & Traces on Failure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: source_code/frontend/playwright-report/
          retention-days: 14

  performance-benchmark:
    name: Non-Functional Performance & Memory (Informational)
    runs-on: ubuntu-latest
    needs: [playwright-e2e-test]
    continue-on-error: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: source_code/frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend & Frontend Dependencies
        run: |
          pip install -r source_code/backend/requirements.txt uvicorn
          cd source_code/frontend && npm ci && npx playwright install chromium

      - name: Run Dedicated Performance Project
        working-directory: source_code/frontend
        run: npm run test:perf
        env:
          CI: true
