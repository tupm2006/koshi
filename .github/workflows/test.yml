name: Tests

on:
  push:
    branches:
      - 'main'
      - 'restructure/source-docs-split'
  pull_request:
    branches:
      - 'main'
      - 'restructure/source-docs-split'

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .          # vite.config.ts is at repo root
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4    # version read from packageManager field

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/backend
    env:
      GEMINI_API_KEY: test-api-key-not-real
      JWT_SECRET_KEY: test-secret-key-for-testing
      DATABASE_URL: "sqlite+aiosqlite:///./test_koshi.db"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/backend/requirements.txt

      - run: pip install -r requirements.txt

      - run: python -m pytest -v
