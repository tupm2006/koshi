# Compose derives the project name from the directory when none is given, so all
# three files in this repo would be project "koshi" — and `up` on one would treat
# the others' containers as orphans and remove them. It did exactly that once
# (F-38). An explicit name keeps the stacks independent.
name: koshi-prod-local

# A real production instance, running on this machine.
#
#   ./scripts/local-prod.sh up          # migrate, then start
#   open http://localhost:8090
#
# This is NOT docker-compose.dev.yml with a different port. The whole point is
# that the production settings are in force:
#
#   ENVIRONMENT=production        the startup safety guard is ARMED — the app
#                                 refuses to boot on a weak secret, a wildcard
#                                 CORS origin, or with demo seeding enabled
#   SEED_DEMO_DATA=false          no pm@tupm.qzz.io / koshi123 accounts; you
#                                 register a real one
#   CORS_ORIGINS pinned           to this instance's own origin, not "*"
#   no implicit create_all        Alembic owns the schema; the app refuses to
#                                 start unless the database is at head, so
#                                 migrations run as an explicit step
#
# Differences from `docker-compose.yml` (the deployment file) are only about
# where it sits: ports are published to localhost instead of joining an external
# `proxy-net` behind Caddy, and there is no TLS because there is no domain.
# Nothing about the application's security posture is relaxed.
services:
  koshi-db:
    image: mysql:8.4
    container_name: koshi-db-prod-local
    restart: unless-stopped
    command:
      # utf8mb4 throughout. MySQL's "utf8" is three bytes and silently
      # truncates an emoji or some CJK characters — in a tool where people
      # write task titles in Vietnamese, that is data loss.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_DATABASE=koshi
      - MYSQL_USER=koshi
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?run scripts/dev-env.sh first (writes ./.env)}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?run scripts/dev-env.sh first (writes ./.env)}
    volumes:
      - koshi-prod-local-mysql:/var/lib/mysql
    healthcheck:
      # The backend must not start before the server accepts connections, or
      # `alembic upgrade` fails on a race that looks like a config error.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - koshi-prod-local

  koshi-backend:
    build:
      context: ./source/backend
      dockerfile: Dockerfile
    container_name: koshi-backend-prod-local
    # One JSON log per container, capped: an access line per request otherwise
    # grows without bound on a long-running host.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    # Docker marks the container unhealthy when the API or its database stops
    # answering; `docker ps` and scripts/monitor.sh read that state.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      koshi-db:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql+pymysql://koshi:${MYSQL_PASSWORD}@koshi-db:3306/koshi?charset=utf8mb4
      - ENVIRONMENT=production
      # Separate from the dev stack's JWT_SECRET on purpose: a session minted
      # against the seeded demo data must not be valid here. `scripts/dev-env.sh`
      # generates both.
      - JWT_SECRET=${PROD_JWT_SECRET:?run scripts/dev-env.sh first (writes ./.env)}
      # PUBLIC_ORIGIN (e.g. https://koshi.huynhca.com) is appended when the
      # instance is published through the Cloudflare tunnel below.
      - CORS_ORIGINS=http://localhost:8090${PUBLIC_ORIGIN:+,${PUBLIC_ORIGIN}}
      - SEED_DEMO_DATA=false
      - ALLOW_UNVERIFIED_GOOGLE_TOKENS=false
      - AI_API_URL=${AI_API_URL:-https://api.groq.com/openai/v1/chat/completions}
      - AI_API_KEY=${AI_API_KEY:-}
      # /api/metrics answers only with this bearer token; unset ⇒ 404 (production).
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      - AI_MODEL_NAME=${AI_MODEL_NAME:-openai/gpt-oss-120b}
      - OLLAMA_URL=http://host.docker.internal:11434/v1/chat/completions
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - koshi-prod-local-data:/app/data
    networks:
      - koshi-prod-local

  koshi-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: koshi-frontend-prod-local
    restart: unless-stopped
    depends_on:
      - koshi-backend
    ports:
      - "127.0.0.1:8090:80"
    networks:
      - koshi-prod-local

  # Publishes the frontend through a Cloudflare Tunnel — outbound only, so no
  # router port is opened and the host's IP is never exposed. Opt-in:
  #   docker compose -f docker-compose.prod-local.yml --profile public up -d
  # Needs ~/.cloudflared/config.yml + the tunnel credentials (scripts/publish.sh).
  cloudflared:
    image: cloudflare/cloudflared:2025.8.1
    container_name: koshi-tunnel
    restart: unless-stopped
    profiles: ["public"]
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    user: "${UID_GID:-1000:1000}"
    volumes:
      - ${HOME}/.cloudflared:/etc/cloudflared:ro
    depends_on:
      - koshi-frontend
    networks:
      - koshi-prod-local

volumes:
  koshi-prod-local-data:
  koshi-prod-local-mysql:

networks:
  koshi-prod-local:
    driver: bridge
