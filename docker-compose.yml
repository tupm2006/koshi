services:
  koshi-backend:
    build:
      context: ./source_code/backend
      dockerfile: Dockerfile
    container_name: koshi-backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - JWT_SECRET=${JWT_SECRET:-koshi_prod_sec_d9a83f4b1e5c2a7f8093e614b82d3f7a1c9e8b0d4f2a6e3c5b8a1f7d9e2c4b6a}
      - DATABASE_URL=sqlite:////app/data/koshi.db
      - ALLOWED_ORIGINS=https://koshi.felixsu.qzz.io,http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
      - AI_API_URL=https://api.openai.com/v1/chat/completions
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL_NAME=gpt-4o-mini
      - OLLAMA_URL=http://host.docker.internal:11434/v1/chat/completions
    volumes:
      - koshi-data:/app/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - koshi-internal
      - proxy-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  koshi-frontend:
    build:
      context: ./source_code/frontend
      dockerfile: Dockerfile
    container_name: koshi
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      koshi-backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - koshi-internal
      - proxy-net

volumes:
  koshi-data:

networks:
  koshi-internal:
    driver: bridge
  proxy-net:
    name: proxy-net
    driver: bridge
